<form fsForm [submit]="save">
  <div class="example-fields">
    <div class="example-field">
      <fs-date-range-field
        [(from)]="from"
        [(to)]="to"
        [name]="'period'"
        [required]="true">
      </fs-date-range-field>
      <div class="example-values">
        from: {{ from() | date: 'medium' }} · to: {{ to() | date: 'medium' }}
      </div>
    </div>
    <div class="example-field">
      <fs-date-range-field
        [(from)]="dateTimeFrom"
        [(to)]="dateTimeTo"
        [name]="'dateTimePeriod'"
        [view]="PickerViewType.DateTime"
        [fromLabel]="'Starts'"
        [toLabel]="'Ends'">
      </fs-date-range-field>
      <div class="example-values">
        from: {{ dateTimeFrom() | date: 'medium' }} · to: {{ dateTimeTo() | date: 'medium' }}
      </div>
    </div>
  </div>
  <button
      mat-button
      color="primary"
      type="submit">
    Save
  </button>
</form>
