<div
  class="picker-container"
  [class.has-preset]="datePickerModel.preset">
  @if (datePickerModel.preset) {
    <fs-date-picker-presets
      [weekStartsOn]="datePickerModel.weekStartsOn"
      (presetChange)="presetChanged($event)">
    </fs-date-picker-presets>
  }
  <div class="calendar-container">
    <div class="date-time">
      <div class="calendar-view">
        <fs-date-picker-header-month-range
          [calendarDate]="leftCalendarDate$ | async"
          [nextCalendarDate]="rightCalendarDate$ | async"
          (goNextMonth)="nextMonth()"
          (goPrevMonth)="prevMonth()">
        </fs-date-picker-header-month-range>
        <div
          #calendars
          class="month-range-container"
          (mouseleave)="hoverCleared()">
          <fs-date-picker-calendar
            [rangeFrom]="modelFrom$ | async"
            [rangeTo]="modelTo$ | async"
            [calendarDate]="leftCalendarDate$ | async"
            [dateMode]="datePickerModel.calendarMode$ | async"
            [highlightStartDate]="modelFrom$ | async"
            [highlightEndDate]="highlightEndDate$ | async"
            [highlightPreview]="highlightPreview$ | async"
            [disabledDates]="datePickerModel.disabledDates$ | async"
            [weekStartsOn]="datePickerModel.weekStartsOn"
            [showToday]="datePickerModel.showNow"
            (hoverDay)="dayHovered($event)"
            (change)="dateChanged($event)">
          </fs-date-picker-calendar>
          <fs-date-picker-calendar
            [rangeFrom]="modelFrom$ | async"
            [rangeTo]="modelTo$ | async"
            [highlightStartDate]="modelFrom$ | async"
            [highlightEndDate]="highlightEndDate$ | async"
            [highlightPreview]="highlightPreview$ | async"
            [calendarDate]="rightCalendarDate$ | async"
            [dateMode]="datePickerModel.calendarMode$ | async"
            [disabledDates]="datePickerModel.disabledDates$ | async"
            [weekStartsOn]="datePickerModel.weekStartsOn"
            [showToday]="datePickerModel.showNow"
            (hoverDay)="dayHovered($event)"
            (change)="dateChanged($event)">
          </fs-date-picker-calendar>
        </div>
      </div>
      @if (datePickerModel.dateMode !== 'year' && datePickerModel.dateMode !== 'month') {
        @if (datePickerModel.view === 'datetime' || datePickerModel.view === 'time') {
          <fs-date-picker-time
            [date]="datePickerModel.model$ | async"
            [minutes]="datePickerModel.minutes"
            [showHeading]="true"
            [disabledTimes]="datePickerModel.disabledTimes$ | async"
            [showNow]="datePickerModel.showNow"
            (onChange)="dateChanged($event)">
          </fs-date-picker-time>
        }
      }
    </div>
    <app-action-buttons>
      <a
        class="button-done"
        mat-button
        color="primary"
        (click)="close()">
        Done
      </a>
    </app-action-buttons>
  </div>
</div>
